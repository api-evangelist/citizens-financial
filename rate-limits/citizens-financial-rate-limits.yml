description: Citizens Financial Group APIs are partner-onboarded via a developer portal. Public
  quantitative rate-limit thresholds are not published in self-serve form; per-second / per-minute
  limits are documented inside the partner developer portal once production access is provisioned and
  may be negotiated as part of the commercial agreement.
notes: Verify exact thresholds inside Citizens partner documentation after onboarding.
