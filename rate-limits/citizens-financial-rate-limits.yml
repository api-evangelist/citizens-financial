    scope: app
    metric: varies
    limit: see Citizens Developer Portal partner documentation
  - name: Production limits
    scope: app/partner
    metric: varies
    limit: per partner agreement; documented inside developer portal after onboarding
policies:
  - name: Backoff Strategy
    description: Clients should implement exponential backoff with jitter on HTTP 429/503 responses
      and honor any Retry-After header.
  - name: Partner provisioning
    description: Higher production limits are configured per partner agreement and may require
      relationship-manager approval and security review.
  - name: OAuth 2.0 token handling
    description: Reuse access tokens until expiry to avoid consuming Authorization-Server rate
      budget.
