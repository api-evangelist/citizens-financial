naftiko: 1.0.0-alpha2
info:
  label: Citizens Bank Accounts API — Transactions
  description: 'Citizens Bank Accounts API — Transactions. 1 operations. Lead operation: Get account transactions. Self-contained
    Naftiko capability covering one Citizens Financial business surface.'
  tags:
  - Citizens Financial
  - Transactions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CITIZENS_FINANCIAL_API_KEY: CITIZENS_FINANCIAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: citizens-bank-accounts-transactions
    baseUri: https://api.citizensbank.com
    description: Citizens Bank Accounts API — Transactions business capability. Self-contained, no shared references.
    resources:
    - name: accounts-accountId-transactions
      path: /accounts/{accountId}/transactions
      operations:
      - name: gettransactions
        method: GET
        description: Get account transactions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountId
          in: path
          type: string
          description: The unique account identifier
          required: true
        - name: fromDate
          in: query
          type: string
          description: Start date for transaction search
        - name: toDate
          in: query
          type: string
          description: End date for transaction search
        - name: limit
          in: query
          type: integer
          description: Maximum number of transactions to return
        - name: offset
          in: query
          type: integer
          description: Offset for pagination
    authentication:
      type: bearer
      token: '{{env.CITIZENS_FINANCIAL_API_KEY}}'
  exposes:
  - type: rest
    namespace: citizens-bank-accounts-transactions-rest
    port: 8080
    description: REST adapter for Citizens Bank Accounts API — Transactions. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/accounts/{accountid}/transactions
      name: accounts-accountid-transactions
      description: REST surface for accounts-accountId-transactions.
      operations:
      - method: GET
        name: gettransactions
        description: Get account transactions
        call: citizens-bank-accounts-transactions.gettransactions
        with:
          accountId: rest.accountId
          fromDate: rest.fromDate
          toDate: rest.toDate
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: citizens-bank-accounts-transactions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Citizens Bank Accounts API — Transactions. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: get-account-transactions
      description: Get account transactions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: citizens-bank-accounts-transactions.gettransactions
      with:
        accountId: tools.accountId
        fromDate: tools.fromDate
        toDate: tools.toDate
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
