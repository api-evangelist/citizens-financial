description: >-
  Citizens Financial Group is one of the oldest and largest financial institutions in the United States, providing
  retail and commercial banking products and services to individuals, small businesses, middle-market companies, and
  large corporations. Citizens exposes its programmable surface through the Citizens developer portal at
  developer.citizensbank.com, with REST APIs for deposit account and transaction data, ATM location services, and
  point-of-sale consumer financing through Citizens Pay. Authentication is OAuth 2.0 and the portal provides both
  sandbox and production environments.
