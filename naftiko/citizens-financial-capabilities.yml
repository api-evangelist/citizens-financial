capabilities:
  - id: citizens-financial.access-accounts
    name: Access deposit accounts
    description: >-
      Retrieve account metadata and detailed transaction histories for
      Savings and Checking accounts under open banking authentication.
    apis:
      - citizens-financial:accounts-api
  - id: citizens-financial.locate-atms
    name: Locate ATMs
    description: >-
      Find Citizens Bank ATMs across the United States by zip code,
      street address, or geographic coordinates.
    apis:
      - citizens-financial:atm-locator-api
  - id: citizens-financial.offer-pos-financing
    name: Offer point-of-sale financing
    description: >-
      Integrate Citizens Pay consumer financing into merchant checkout
      flows so customers can pay over time at participating retailers.
    apis:
      - citizens-financial:citizens-pay-api
