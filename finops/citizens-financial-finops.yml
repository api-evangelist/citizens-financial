description: FOCUS-aligned FinOps shape for Citizens Financial Group's developer APIs. Cost is driven
  by Citizens' underlying commercial banking, payments, and treasury services - APIs themselves are
  not separately metered; charges flow from per-transaction wire / ACH / RTP fees and account-level
  service charges in the master commercial banking agreement.
notes: Per-API meters below are placeholders that mirror typical commercial banking line items.
sources:
  - https://www.citizensbank.com/corporate-finance/
billingModel:
  pricingCategory: Take Rate + Per-Transaction Fees
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Tax
    - Adjustment
    - Refund
    - Credit
focusColumns:
  ServiceName: Citizens Financial
  ServiceCategory: Banking
  ProviderName: Citizens Financial Group
  PublisherName: Citizens Bank, N.A.
  InvoiceIssuerName: Citizens Bank, N.A.
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: payment_transactions
    description: ACH / Wire / RTP payments initiated via Citizens APIs.
    unit: transaction
    aggregation: sum
    dimensions:
      - rail
      - direction
      - geography
  - name: account_services
    description: Monthly account-level service charges (statement reporting, balance reporting).
    unit: account-month
    aggregation: max
    dimensions:
      - account_type
  - name: api_calls
    description: API call counts (informational; not directly billed).
    unit: request
    aggregation: sum
    dimensions:
      - api_product
      - environment
principles:
  - name: Visibility
    description: Use Citizens commercial account-analysis statements and the Citizens developer portal
      usage dashboard to track API consumption alongside transaction fees.
  - name: Allocation
    description: Tag every API client / app to a Citizens account and business unit so payment line
      items can be attributed back to the consuming team.
  - name: Optimization
    description: Route low-priority payments through ACH instead of wire, reuse OAuth tokens, and
      throttle balance-reporting polling cadence.
  - name: Accountability
    description: Treasury operations owns Citizens service-fee budgets; partner integration owners are
      accountable for clean reconciliation and exception management.
